<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Writing Task 1</title>
  <style>
    :root {
      --blue: #4f7cff;
      --blue-dark: #365fd6;
      --green: #0f9f72;
      --red: #dc4545;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #dfe5ef;
      --soft: #f6f8fc;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 8px;
      color: var(--ink);
      background: #edf1f7;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    button, textarea, input { font: inherit; }
    button, label[for] { -webkit-tap-highlight-color: transparent; }

    .app {
      width: 100%;
      min-height: calc(100vh - 16px);
      margin: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(520px, 0.8fr) minmax(620px, 1fr);
      gap: 12px;
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 20px 55px rgba(35, 48, 76, .12);
    }

    .column { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
    .card { border: 1px solid var(--line); border-radius: 15px; background: var(--white); }

    .chart-types {
      padding: 11px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      background: var(--soft);
    }

    .chart-types strong { margin-right: 3px; font-size: .9rem; }

    .chip {
      padding: 7px 13px;
      border: 1px solid #ced7e6;
      border-radius: 999px;
      color: #4b5563;
      background: var(--white);
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .chip:hover, .chip.active { color: #fff; border-color: var(--blue); background: var(--blue); }

    .question { padding: 15px 17px; }
    .label { display: block; margin-bottom: 8px; font-size: .92rem; font-weight: 750; }

    textarea {
      width: 100%;
      color: var(--ink);
      border: 0;
      outline: 0;
      resize: vertical;
      background: transparent;
      line-height: 1.65;
    }

    #questionInput { min-height: 76px; }

    .writing {
      flex: 1;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      padding: 11px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }

    .toolbar-title { font-weight: 750; font-size: .93rem; }
    .control { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .82rem; }
    .control input { width: 90px; accent-color: var(--blue); }
    .control output { min-width: 42px; color: var(--ink); font-weight: 750; text-align: right; }
    .counter { padding: 5px 10px; border-radius: 999px; background: #e9eef7; font-size: .82rem; }

    #essayInput {
      flex: 1;
      min-height: 300px;
      padding: 18px;
      resize: none;
      font: 18px/1.8 Georgia, "Times New Roman", serif;
    }

    .actions {
      padding: 11px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
    }

    .btn {
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: .86rem;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: #fff; background: var(--blue); }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-success { color: #fff; background: var(--green); }
    .btn-light { color: var(--ink); border-color: #ced7e6; background: #fff; }
    .btn-danger { color: var(--red); border-color: #f1b4b4; background: #fff5f5; }

    .image-card {
      flex: 1;
      min-height: 470px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .image-card.dragover { border-color: var(--blue); box-shadow: inset 0 0 0 2px rgba(79, 124, 255, .18); }

    .image-stage {
      flex: 1;
      min-height: 330px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      position: relative;
      background:
        linear-gradient(45deg, #f8fafc 25%, transparent 25%),
        linear-gradient(-45deg, #f8fafc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f8fafc 75%),
        linear-gradient(-45deg, transparent 75%, #f8fafc 75%), #fff;
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      cursor: pointer;
    }

    .placeholder { max-width: 360px; color: #8993a4; text-align: center; pointer-events: none; }
    .placeholder-icon { margin-bottom: 8px; font-size: 3.7rem; }
    .placeholder strong { display: block; margin-bottom: 7px; color: #556070; }
    .placeholder small { line-height: 1.55; }

    #previewImage {
      display: none;
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    #fileInput, #jsonInput { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .image-actions { justify-content: center; }

    .collection { padding-bottom: 10px; overflow: hidden; }
    .collection-title { padding: 12px 14px 5px; font-size: .88rem; font-weight: 750; }
    .saved-list { max-height: 190px; margin: 4px 12px; overflow-y: auto; }
    .empty { padding: 18px; color: #929baa; text-align: center; font-size: .85rem; }

    .saved-item {
      margin-bottom: 6px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 9px;
      background: var(--soft);
      cursor: pointer;
    }

    .saved-item:hover { background: #edf2fa; }
    .saved-info { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .83rem; }
    .delete-item { padding: 4px 7px; color: var(--red); border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
    .delete-item:hover { background: #fee2e2; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 99;
      max-width: min(520px, calc(100vw - 32px));
      padding: 11px 18px;
      color: #fff;
      border-radius: 10px;
      background: #253044;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
      opacity: 0;
      transform: translate(-50%, 14px);
      pointer-events: none;
      transition: .2s;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      body { padding: 10px; }
      .app { min-height: calc(100vh - 20px); grid-template-columns: 1fr; padding: 12px; border-radius: 15px; }
      .image-card { min-height: 430px; }
      .writing { min-height: 500px; }
    }

    @media (min-width: 901px) and (max-width: 1250px) {
      .app {
        grid-template-columns: minmax(0, 1fr) minmax(480px, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="column">
      <div class="chart-types card" id="chartTypes">
        <strong>📊 Loại biểu đồ:</strong>
        <button class="chip" type="button" data-chart="line">📈 Line</button>
        <button class="chip" type="button" data-chart="pie">🥧 Pie</button>
        <button class="chip" type="button" data-chart="bar">📊 Bar</button>
        <button class="chip" type="button" data-chart="mix">🔀 Mix</button>
        <button class="chip" type="button" data-chart="map">🗺️ Map</button>
        <button class="chip" type="button" data-chart="process">⚙️ Process</button>
      </div>

      <div class="question card">
        <label class="label" for="questionInput">📋 Đề bài (Writing Task 1)</label>
        <textarea id="questionInput" placeholder="Nhập đề bài tại đây..."></textarea>
      </div>

      <div class="writing card">
        <div class="toolbar">
          <span class="toolbar-title">✍️ Bài viết của bạn</span>
          <label class="control">Cỡ chữ
            <input id="fontSize" type="range" min="12" max="28" value="18">
            <output id="fontSizeValue">18px</output>
          </label>
          <span class="counter"><b id="wordCount">0</b> từ</span>
        </div>
        <textarea id="essayInput" placeholder="Viết bài phân tích biểu đồ tại đây..."></textarea>
        <div class="actions">
          <button class="btn btn-primary" id="saveEssay" type="button">💾 Lưu bài .txt</button>
          <button class="btn btn-light" id="clearEssay" type="button">🗑️ Xóa bài viết</button>
          <button class="btn btn-light" id="fillSample" type="button">📄 Điền mẫu</button>
        </div>
      </div>
    </section>

    <section class="column">
      <div class="image-card card" id="dropZone">
        <div class="toolbar">
          <span class="toolbar-title">🖼️ Biểu đồ / Hình ảnh</span>
          <label class="control">Kích thước
            <input id="imageSize" type="range" min="30" max="100" value="100">
            <output id="imageSizeValue">100%</output>
          </label>
        </div>

        <div class="image-stage" id="imageStage" tabindex="0" role="button" aria-label="Chọn hoặc dán ảnh">
          <div class="placeholder" id="placeholder">
            <div class="placeholder-icon">📈</div>
            <strong>Bấm hoặc kéo thả hình vào đây</strong>
            <small>Mac: Cmd+V · Windows: Ctrl+V<br>Hỗ trợ JPG, PNG, WEBP, GIF và SVG</small>
          </div>
          <img id="previewImage" alt="Biểu đồ xem trước">
        </div>

        <div class="actions image-actions">
          <label class="btn btn-light" for="fileInput">📁 Chọn hình</label>
          <input id="fileInput" type="file" accept="image/*">
          <button class="btn btn-danger" id="removeImage" type="button">✖ Gỡ hình</button>
        </div>
      </div>

      <div class="collection card">
        <div class="actions image-actions">
          <button class="btn btn-success" id="addQuestion" type="button">➕ Thêm vào bộ đề</button>
          <button class="btn btn-light" id="exportJson" type="button">📤 Xuất JSON</button>
          <label class="btn btn-light" for="jsonInput">📥 Nhập JSON</label>
          <input id="jsonInput" type="file" accept="application/json,.json">
        </div>
        <div class="collection-title">📚 Bộ đề đã lưu (<span id="savedCount">0</span>)</div>
        <div class="saved-list" id="savedList"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const $ = id => document.getElementById(id);
      const questionInput = $('questionInput');
      const essayInput = $('essayInput');
      const wordCount = $('wordCount');
      const fontSize = $('fontSize');
      const fontSizeValue = $('fontSizeValue');
      const dropZone = $('dropZone');
      const imageStage = $('imageStage');
      const fileInput = $('fileInput');
      const previewImage = $('previewImage');
      const placeholder = $('placeholder');
      const imageSize = $('imageSize');
      const imageSizeValue = $('imageSizeValue');
      const savedList = $('savedList');
      const savedCount = $('savedCount');
      const jsonInput = $('jsonInput');
      const toast = $('toast');
      const chartButtons = [...document.querySelectorAll('[data-chart]')];

      const STORAGE_KEY = 'ielts_task_1_questions_v2';
      const FONT_KEY = 'ielts_task_1_font_size';
      const IMAGE_SIZE_KEY = 'ielts_task_1_image_size';
      const MAX_FILE_SIZE = 20 * 1024 * 1024;
      let currentChartType = '';
      let savedQuestions = [];
      let toastTimer;

      function notify(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
      }

      function updateWordCount() {
        const text = essayInput.value.trim();
        wordCount.textContent = text ? text.split(/\s+/).length : 0;
      }

      function selectChart(type) {
        currentChartType = type || '';
        chartButtons.forEach(button => {
          button.classList.toggle('active', button.dataset.chart === currentChartType);
        });
      }

      function showImage(src) {
        if (!src) return;
        previewImage.onload = () => notify('🖼️ Đã tải hình lên!');
        previewImage.onerror = () => {
          removeCurrentImage(false);
          notify('⚠️ Không đọc được hình này.');
        };
        previewImage.src = src;
        previewImage.style.display = 'block';
        placeholder.style.display = 'none';
      }

      function removeCurrentImage(showMessage = true) {
        previewImage.removeAttribute('src');
        previewImage.style.display = 'none';
        placeholder.style.display = 'block';
        fileInput.value = '';
        if (showMessage) notify('Đã gỡ hình.');
      }

      function readImageFile(file) {
        if (!file) return;
        if (!file.type || !file.type.startsWith('image/')) {
          notify('⚠️ Vui lòng chọn đúng file hình ảnh.');
          return;
        }
        if (file.size > MAX_FILE_SIZE) {
          notify('⚠️ Hình quá lớn. Vui lòng chọn hình dưới 20 MB.');
          return;
        }

        const reader = new FileReader();
        reader.onload = event => showImage(event.target.result);
        reader.onerror = () => notify('⚠️ Không thể đọc file hình.');
        reader.readAsDataURL(file);
      }

      function handlePaste(event) {
        const items = [...(event.clipboardData?.items || [])];
        const imageItem = items.find(item => item.kind === 'file' && item.type.startsWith('image/'));
        if (imageItem) {
          event.preventDefault();
          readImageFile(imageItem.getAsFile());
          return;
        }

        const pastedHtml = event.clipboardData?.getData('text/html') || '';
        if (pastedHtml) {
          const doc = new DOMParser().parseFromString(pastedHtml, 'text/html');
          const src = doc.querySelector('img')?.src;
          if (src) {
            event.preventDefault();
            showImage(src);
          }
        }
      }

      function download(name, content, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      }

      function saveEssayFile() {
        const essay = essayInput.value.trim();
        if (!essay) {
          notify('⚠️ Bạn chưa viết bài.');
          return;
        }
        const question = questionInput.value.trim() || 'Không có đề bài';
        const content = [
          `Loại biểu đồ: ${currentChartType || 'Chưa chọn'}`,
          '', 'ĐỀ BÀI:', question,
          '', 'BÀI VIẾT:', essay,
          '', '---', `Số từ: ${wordCount.textContent}`
        ].join('\n');
        download('ielts-writing-task-1.txt', content, 'text/plain;charset=utf-8');
        notify('✅ Đã lưu bài viết.');
      }

      function loadSavedQuestions() {
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          savedQuestions = Array.isArray(data) ? data : [];
        } catch {
          savedQuestions = [];
        }
        renderSavedQuestions();
      }

      function persistQuestions() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(savedQuestions));
          renderSavedQuestions();
          return true;
        } catch (error) {
          console.error(error);
          notify('⚠️ Bộ nhớ trình duyệt đã đầy. Hãy xuất JSON rồi xóa bớt đề.');
          return false;
        }
      }

      function renderSavedQuestions() {
        savedList.replaceChildren();
        savedCount.textContent = savedQuestions.length;

        if (!savedQuestions.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'Chưa có đề nào';
          savedList.appendChild(empty);
          return;
        }

        savedQuestions.forEach((item, index) => {
          const row = document.createElement('div');
          row.className = 'saved-item';
          row.title = 'Bấm để mở đề';

          const info = document.createElement('div');
          info.className = 'saved-info';
          info.textContent = `${item.chartType || 'unknown'} · ${item.question || 'Chưa có đề bài'}`;

          const remove = document.createElement('button');
          remove.className = 'delete-item';
          remove.type = 'button';
          remove.textContent = '✖';
          remove.title = 'Xóa đề này';
          remove.addEventListener('click', event => {
            event.stopPropagation();
            const oldItems = [...savedQuestions];
            savedQuestions.splice(index, 1);
            if (!persistQuestions()) savedQuestions = oldItems;
            else notify('Đã xóa đề.');
          });

          row.addEventListener('click', () => loadQuestion(item));
          row.append(info, remove);
          savedList.appendChild(row);
        });
      }

      function loadQuestion(item) {
        questionInput.value = item.question || '';
        selectChart(item.chartType || '');
        if (item.image) showImage(item.image);
        else removeCurrentImage(false);
        notify('📂 Đã mở đề.');
      }

      function addCurrentQuestion() {
        const question = questionInput.value.trim();
        const image = previewImage.getAttribute('src') || '';
        if (!question && !image) {
          notify('⚠️ Hãy nhập đề bài hoặc thêm hình trước.');
          return;
        }

        const oldItems = [...savedQuestions];
        savedQuestions.unshift({
          question: question || 'Chưa có đề bài',
          chartType: currentChartType || 'unknown',
          image,
          createdAt: new Date().toISOString()
        });
        if (!persistQuestions()) savedQuestions = oldItems;
        else notify('✅ Đã thêm vào bộ đề.');
      }

      function exportQuestions() {
        if (!savedQuestions.length) {
          notify('⚠️ Bộ đề đang trống.');
          return;
        }
        download(
          'ielts-task-1-questions.json',
          JSON.stringify(savedQuestions, null, 2),
          'application/json;charset=utf-8'
        );
        notify('✅ Đã xuất bộ đề.');
      }

      function importQuestions(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = event => {
          try {
            const data = JSON.parse(event.target.result);
            if (!Array.isArray(data)) throw new Error('JSON must be an array');
            const validItems = data.filter(item => item && typeof item === 'object');
            const oldItems = [...savedQuestions];
            savedQuestions = validItems;
            if (!persistQuestions()) savedQuestions = oldItems;
            else notify(`✅ Đã nhập ${validItems.length} đề.`);
          } catch (error) {
            console.error(error);
            notify('⚠️ File JSON không hợp lệ.');
          } finally {
            jsonInput.value = '';
          }
        };
        reader.onerror = () => notify('⚠️ Không thể đọc file JSON.');
        reader.readAsText(file, 'utf-8');
      }

      chartButtons.forEach(button => {
        button.addEventListener('click', () => selectChart(button.dataset.chart));
      });

      essayInput.addEventListener('input', updateWordCount);

      fontSize.addEventListener('input', () => {
        essayInput.style.fontSize = `${fontSize.value}px`;
        fontSizeValue.textContent = `${fontSize.value}px`;
        localStorage.setItem(FONT_KEY, fontSize.value);
      });

      imageSize.addEventListener('input', () => {
        previewImage.style.width = `${imageSize.value}%`;
        imageSizeValue.textContent = `${imageSize.value}%`;
        localStorage.setItem(IMAGE_SIZE_KEY, imageSize.value);
      });

      fileInput.addEventListener('change', () => {
        readImageFile(fileInput.files?.[0]);
        fileInput.value = '';
      });

      imageStage.addEventListener('click', () => fileInput.click());
      imageStage.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          fileInput.click();
        }
      });

      ['dragenter', 'dragover'].forEach(type => {
        dropZone.addEventListener(type, event => {
          event.preventDefault();
          dropZone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach(type => {
        dropZone.addEventListener(type, event => {
          event.preventDefault();
          dropZone.classList.remove('dragover');
        });
      });

      dropZone.addEventListener('drop', event => {
        const file = [...(event.dataTransfer?.files || [])].find(item => item.type.startsWith('image/'));
        if (file) {
          readImageFile(file);
          return;
        }

        const html = event.dataTransfer?.getData('text/html') || '';
        const text = event.dataTransfer?.getData('text/plain') || '';
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const src = doc.querySelector('img')?.src || (/^(https?:|data:image)/i.test(text) ? text : '');
        if (src) showImage(src);
        else notify('⚠️ Không nhận diện được hình ảnh.');
      });

      document.addEventListener('paste', handlePaste);
      $('removeImage').addEventListener('click', event => {
        event.stopPropagation();
        removeCurrentImage();
      });

      $('saveEssay').addEventListener('click', saveEssayFile);
      $('clearEssay').addEventListener('click', () => {
        essayInput.value = '';
        updateWordCount();
        notify('Đã xóa bài viết.');
      });

      $('fillSample').addEventListener('click', () => {
        questionInput.value = 'The chart below shows the percentage of households in owned and rented accommodation in England and Wales between 1918 and 2011.';
        essayInput.value = `The bar chart compares the proportions of households living in owned and rented accommodation in England and Wales from 1918 to 2011.\n\nOverall, home ownership became increasingly common during most of the period, while renting followed the opposite trend. However, both patterns changed slightly in the final decade.\n\nIn 1918, approximately 78% of households rented their homes, compared with only 22% that owned them. The gap then narrowed steadily, and the two figures were equal at 50% in 1971.\n\nAfter 1971, ownership continued to rise and reached a peak of about 69% in 2001. By contrast, renting fell to roughly 31%. In the final year, the ownership rate declined to around 64%, whereas the proportion of renters recovered to 36%.`;
        selectChart('bar');
        updateWordCount();
        notify('📄 Đã điền bài mẫu.');
      });

      $('addQuestion').addEventListener('click', addCurrentQuestion);
      $('exportJson').addEventListener('click', exportQuestions);
      jsonInput.addEventListener('change', () => importQuestions(jsonInput.files?.[0]));

      const savedFont = Number(localStorage.getItem(FONT_KEY));
      if (savedFont >= 12 && savedFont <= 28) fontSize.value = savedFont;
      essayInput.style.fontSize = `${fontSize.value}px`;
      fontSizeValue.textContent = `${fontSize.value}px`;

      const savedImageSize = Number(localStorage.getItem(IMAGE_SIZE_KEY));
      if (savedImageSize >= 30 && savedImageSize <= 100) imageSize.value = savedImageSize;
      previewImage.style.width = `${imageSize.value}%`;
      imageSizeValue.textContent = `${imageSize.value}%`;

      updateWordCount();
      loadSavedQuestions();
    })();
  </script>
</body>
