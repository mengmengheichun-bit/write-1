<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Writing Task 1</title>
  <style>
    :root {
      --blue: #4f7cff;
      --blue-dark: #365fd6;
      --green: #0f9f72;
      --red: #dc4545;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #dfe5ef;
      --soft: #f6f8fc;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 8px;
      color: var(--ink);
      background: #edf1f7;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    button, textarea, input { font: inherit; }
    button, label[for] { -webkit-tap-highlight-color: transparent; }

    .app {
      width: 100%;
      min-height: calc(100vh - 16px);
      margin: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(520px, 0.8fr) minmax(620px, 1fr);
      gap: 12px;
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 20px 55px rgba(35, 48, 76, .12);
    }

    .column { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
    .card { border: 1px solid var(--line); border-radius: 15px; background: var(--white); }

    .chart-types {
      padding: 11px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      background: var(--soft);
    }

    .chart-types strong { margin-right: 3px; font-size: .9rem; }

    .chip {
      padding: 7px 13px;
      border: 1px solid #ced7e6;
      border-radius: 999px;
      color: #4b5563;
      background: var(--white);
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .chip:hover, .chip.active { color: #fff; border-color: var(--blue); background: var(--blue); }

    .question { padding: 15px 17px; }
    .label { display: block; margin-bottom: 8px; font-size: .92rem; font-weight: 750; }

    textarea {
      width: 100%;
      color: var(--ink);
      border: 0;
      outline: 0;
      resize: vertical;
      background: transparent;
      line-height: 1.65;
    }

    #questionInput { min-height: 76px; }

    .writing {
      flex: 1;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      padding: 11px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }

    .toolbar-title { font-weight: 750; font-size: .93rem; }
    .control { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .82rem; }
    .control input { width: 90px; accent-color: var(--blue); }
    .control output { min-width: 42px; color: var(--ink); font-weight: 750; text-align: right; }
    .counter { padding: 5px 10px; border-radius: 999px; background: #e9eef7; font-size: .82rem; }

    #essayInput {
      flex: 1;
      min-height: 300px;
      padding: 18px;
      resize: none;
      font: 18px/1.8 Georgia, "Times New Roman", serif;
    }

    .actions {
      padding: 11px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
    }

    .btn {
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: .86rem;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: #fff; background: var(--blue); }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-success { color: #fff; background: var(--green); }
    .btn-light { color: var(--ink); border-color: #ced7e6; background: #fff; }
    .btn-danger { color: var(--red); border-color: #f1b4b4; background: #fff5f5; }

    .image-card {
      flex: 1;
      min-height: 470px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .image-card.dragover { border-color: var(--blue); box-shadow: inset 0 0 0 2px rgba(79, 124, 255, .18); }

    .image-stage {
      flex: 1;
      min-height: 330px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      position: relative;
      background:
        linear-gradient(45deg, #f8fafc 25%, transparent 25%),
        linear-gradient(-45deg, #f8fafc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f8fafc 75%),
        linear-gradient(-45deg, transparent 75%, #f8fafc 75%), #fff;
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      cursor: pointer;
    }

    .placeholder { max-width: 360px; color: #8993a4; text-align: center; pointer-events: none; }
    .placeholder-icon { margin-bottom: 8px; font-size: 3.7rem; }
    .placeholder strong { display: block; margin-bottom: 7px; color: #556070; }
    .placeholder small { line-height: 1.55; }

    #previewImage {
      display: none;
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    #fileInput, #jsonInput { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .image-actions { justify-content: center; }

    .collection { padding-bottom: 12px; overflow: hidden; }

    .collection-heading {
      padding: 13px 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .collection-title { font-size: .92rem; font-weight: 750; }
    .collection-subtitle { margin-top: 3px; color: var(--muted); font-size: .76rem; }

    .search-box {
      width: min(260px, 48%);
      min-width: 170px;
      padding: 9px 12px;
      color: var(--ink);
      border: 1px solid #ced7e6;
      border-radius: 9px;
      outline: none;
      background: #fff;
      font-size: .84rem;
    }

    .search-box:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79, 124, 255, .13); }
    .saved-list { max-height: 390px; margin: 4px 12px; overflow-y: auto; scrollbar-gutter: stable; }
    .empty { padding: 18px; color: #929baa; text-align: center; font-size: .85rem; }

    .saved-item {
      margin-bottom: 6px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 9px;
      background: var(--soft);
      cursor: pointer;
    }

    .saved-item:hover { background: #edf2fa; }
    .saved-info { min-width: 0; flex: 1; }
    .saved-question { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .84rem; font-weight: 650; }
    .saved-meta { margin-top: 3px; color: var(--muted); font-size: .74rem; }
    .delete-item { padding: 4px 7px; color: var(--red); border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
    .delete-item:hover { background: #fee2e2; }

    body.modal-open { overflow: hidden; }
    .archive-modal { position: fixed; inset: 0; z-index: 80; padding: 28px; display: none; align-items: center; justify-content: center; background: rgba(20, 30, 48, .58); backdrop-filter: blur(4px); }
    .archive-modal.open { display: flex; }
    .archive-panel { width: min(980px, 100%); max-height: min(820px, calc(100vh - 56px)); display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; background: #fff; box-shadow: 0 28px 80px rgba(14, 24, 42, .28); }
    .archive-header { padding: 17px 20px 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
    .archive-title { margin: 0; font-size: 1.12rem; }
    .archive-count { margin-top: 4px; color: var(--muted); font-size: .82rem; }
    .close-modal { width: 38px; height: 38px; flex: 0 0 auto; color: #526071; border: 1px solid #d7deea; border-radius: 10px; background: #fff; font-size: 1.1rem; cursor: pointer; }
    .close-modal:hover { color: var(--red); background: #fff5f5; }
    .archive-search-wrap { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--soft); }
    .archive-search { width: 100%; padding: 12px 14px; color: var(--ink); border: 1px solid #cbd5e3; border-radius: 11px; outline: none; background: #fff; font-size: .95rem; }
    .archive-search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79, 124, 255, .13); }
    .archive-list { min-height: 240px; padding: 16px 20px 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; gap: 10px; overflow-y: auto; scrollbar-gutter: stable; }
    .archive-item { min-width: 0; padding: 14px; position: relative; border: 1px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; }
    .archive-item:hover { border-color: #b9c8e6; background: #f8faff; }
    .archive-item .saved-question { padding-right: 30px; white-space: normal; line-height: 1.45; }
    .archive-preview { margin-top: 8px; color: #596579; font-size: .8rem; line-height: 1.5; }
    .archive-item .delete-item { position: absolute; top: 9px; right: 9px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 99;
      max-width: min(520px, calc(100vw - 32px));
      padding: 11px 18px;
      color: #fff;
      border-radius: 10px;
      background: #253044;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
      opacity: 0;
      transform: translate(-50%, 14px);
      pointer-events: none;
      transition: .2s;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      body { padding: 10px; }
      .app { min-height: calc(100vh - 20px); grid-template-columns: 1fr; padding: 12px; border-radius: 15px; }
      .image-card { min-height: 430px; }
      .writing { min-height: 500px; }
      .collection-heading { align-items: stretch; flex-direction: column; }
      .search-box { width: 100%; }
      .saved-list { max-height: 480px; }
      .archive-modal { padding: 10px; }
      .archive-panel { max-height: calc(100vh - 20px); }
      .archive-list { grid-template-columns: 1fr; padding: 12px; }
      .archive-header, .archive-search-wrap { padding-left: 14px; padding-right: 14px; }
    }

    @media (min-width: 901px) and (max-width: 1250px) {
      .app {
        grid-template-columns: minmax(0, 1fr) minmax(480px, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="column">
      <div class="chart-types card" id="chartTypes">
        <strong>📊 Loại biểu đồ:</strong>
        <button class="chip" type="button" data-chart="line">📈 Line</button>
        <button class="chip" type="button" data-chart="pie">🥧 Pie</button>
        <button class="chip" type="button" data-chart="bar">📊 Bar</button>
        <button class="chip" type="button" data-chart="mix">🔀 Mix</button>
        <button class="chip" type="button" data-chart="map">🗺️ Map</button>
        <button class="chip" type="button" data-chart="process">⚙️ Process</button>
      </div>

      <div class="question card">
        <label class="label" for="questionInput">📋 Đề bài (Writing Task 1)</label>
        <textarea id="questionInput" placeholder="Nhập đề bài tại đây..."></textarea>
      </div>

      <div class="writing card">
        <div class="toolbar">
          <span class="toolbar-title">✍️ Bài viết của bạn</span>
          <label class="control">Cỡ chữ
            <input id="fontSize" type="range" min="12" max="28" value="18">
            <output id="fontSizeValue">18px</output>
          </label>
          <span class="counter"><b id="wordCount">0</b> từ</span>
        </div>
        <textarea id="essayInput" placeholder="Viết bài phân tích biểu đồ tại đây..."></textarea>
        <div class="actions">
          <button class="btn btn-primary" id="saveEssay" type="button">💾 Lưu bài .txt</button>
          <button class="btn btn-light" id="clearEssay" type="button">🗑️ Xóa bài viết</button>
          <button class="btn btn-light" id="fillSample" type="button">📄 Điền mẫu</button>
        </div>
      </div>
    </section>

    <section class="column">
      <div class="image-card card" id="dropZone">
        <div class="toolbar">
          <span class="toolbar-title">🖼️ Biểu đồ / Hình ảnh</span>
          <label class="control">Kích thước
            <input id="imageSize" type="range" min="30" max="100" value="100">
            <output id="imageSizeValue">100%</output>
          </label>
        </div>

        <div class="image-stage" id="imageStage" tabindex="0" role="button" aria-label="Chọn hoặc dán ảnh">
          <div class="placeholder" id="placeholder">
            <div class="placeholder-icon">📈</div>
            <strong>Bấm hoặc kéo thả hình vào đây</strong>
            <small>Mac: Cmd+V · Windows: Ctrl+V<br>Hỗ trợ JPG, PNG, WEBP, GIF và SVG</small>
          </div>
          <img id="previewImage" alt="Biểu đồ xem trước">
        </div>

        <div class="actions image-actions">
          <label class="btn btn-light" for="fileInput">📁 Chọn hình</label>
          <input id="fileInput" type="file" accept="image/*">
          <button class="btn btn-danger" id="removeImage" type="button">✖ Gỡ hình</button>
        </div>
      </div>

      <div class="collection card">
        <div class="actions image-actions">
          <button class="btn btn-success" id="addQuestion" type="button">➕ Thêm vào bộ đề</button>
          <button class="btn btn-light" id="exportJson" type="button">📤 Xuất JSON</button>
          <label class="btn btn-light" for="jsonInput">📥 Nhập JSON</label>
          <input id="jsonInput" type="file" accept="application/json,.json">
        </div>
        <div class="collection-heading">
          <div>
            <div class="collection-title">📚 Kho bài đã lưu (<span id="savedCount">0</span>)</div>
            <div class="collection-subtitle" id="collectionSubtitle">Tất cả bài · mới nhất trước</div>
          </div>
          <input class="search-box" id="searchSaved" type="search" placeholder="🔎 Tìm đề hoặc bài viết..." aria-label="Tìm trong bài đã lưu">
        </div>
        <div class="saved-list" id="savedList"></div>
      </div>
    </section>
  </main>

  <div class="archive-modal" id="archiveModal" role="dialog" aria-modal="true" aria-labelledby="archiveTitle" aria-hidden="true">
    <div class="archive-panel">
      <div class="archive-header">
        <div>
          <h2 class="archive-title" id="archiveTitle">Kho bài Line</h2>
          <div class="archive-count" id="archiveCount">0 bài · mới nhất trước</div>
        </div>
        <button class="close-modal" id="closeArchive" type="button" aria-label="Đóng cửa sổ">✕</button>
      </div>
      <div class="archive-search-wrap">
        <input class="archive-search" id="archiveSearch" type="search" placeholder="🔎 Tìm theo đề bài hoặc nội dung, ví dụ: employee" aria-label="Tìm bài trong cửa sổ">
      </div>
      <div class="archive-list" id="archiveList"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const $ = id => document.getElementById(id);
      const questionInput = $('questionInput');
      const essayInput = $('essayInput');
      const wordCount = $('wordCount');
      const fontSize = $('fontSize');
      const fontSizeValue = $('fontSizeValue');
      const dropZone = $('dropZone');
      const imageStage = $('imageStage');
      const fileInput = $('fileInput');
      const previewImage = $('previewImage');
      const placeholder = $('placeholder');
      const imageSize = $('imageSize');
      const imageSizeValue = $('imageSizeValue');
      const savedList = $('savedList');
      const savedCount = $('savedCount');
      const searchSaved = $('searchSaved');
      const collectionSubtitle = $('collectionSubtitle');
      const archiveModal = $('archiveModal');
      const archiveTitle = $('archiveTitle');
      const archiveCount = $('archiveCount');
      const archiveSearch = $('archiveSearch');
      const archiveList = $('archiveList');
      const closeArchive = $('closeArchive');
      const jsonInput = $('jsonInput');
      const toast = $('toast');
      const chartButtons = [...document.querySelectorAll('[data-chart]')];

      const STORAGE_KEY = 'ielts_task_1_questions_v2';
      const FONT_KEY = 'ielts_task_1_font_size';
      const IMAGE_SIZE_KEY = 'ielts_task_1_image_size';
      const MAX_FILE_SIZE = 20 * 1024 * 1024;
      let currentChartType = '';
      let archiveChartType = '';
      let savedQuestions = [];
      let toastTimer;

      function notify(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
      }

      function updateWordCount() {
        const text = essayInput.value.trim();
        wordCount.textContent = text ? text.split(/\s+/).length : 0;
      }

      function selectChart(type) {
        currentChartType = type || '';
        chartButtons.forEach(button => {
          button.classList.toggle('active', button.dataset.chart === currentChartType);
        });
        renderSavedQuestions();
      }

      function showImage(src) {
        if (!src) return;
        previewImage.onload = () => notify('🖼️ Đã tải hình lên!');
        previewImage.onerror = () => {
          removeCurrentImage(false);
          notify('⚠️ Không đọc được hình này.');
        };
        previewImage.src = src;
        previewImage.style.display = 'block';
        placeholder.style.display = 'none';
      }

      function removeCurrentImage(showMessage = true) {
        previewImage.removeAttribute('src');
        previewImage.style.display = 'none';
        placeholder.style.display = 'block';
        fileInput.value = '';
        if (showMessage) notify('Đã gỡ hình.');
      }

      function readImageFile(file) {
        if (!file) return;
        if (!file.type || !file.type.startsWith('image/')) {
          notify('⚠️ Vui lòng chọn đúng file hình ảnh.');
          return;
        }
        if (file.size > MAX_FILE_SIZE) {
          notify('⚠️ Hình quá lớn. Vui lòng chọn hình dưới 20 MB.');
          return;
        }

        const reader = new FileReader();
        reader.onload = event => showImage(event.target.result);
        reader.onerror = () => notify('⚠️ Không thể đọc file hình.');
        reader.readAsDataURL(file);
      }

      function handlePaste(event) {
        const items = [...(event.clipboardData?.items || [])];
        const imageItem = items.find(item => item.kind === 'file' && item.type.startsWith('image/'));
        if (imageItem) {
          event.preventDefault();
          readImageFile(imageItem.getAsFile());
          return;
        }

        const pastedHtml = event.clipboardData?.getData('text/html') || '';
        if (pastedHtml) {
          const doc = new DOMParser().parseFromString(pastedHtml, 'text/html');
          const src = doc.querySelector('img')?.src;
          if (src) {
            event.preventDefault();
            showImage(src);
          }
        }
      }

      function download(name, content, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      }

      function saveEssayFile() {
        const essay = essayInput.value.trim();
        if (!essay) {
          notify('⚠️ Bạn chưa viết bài.');
          return;
        }
        const question = questionInput.value.trim() || 'Không có đề bài';
        const content = [
          `Loại biểu đồ: ${currentChartType || 'Chưa chọn'}`,
          '', 'ĐỀ BÀI:', question,
          '', 'BÀI VIẾT:', essay,
          '', '---', `Số từ: ${wordCount.textContent}`
        ].join('\n');
        download('ielts-writing-task-1.txt', content, 'text/plain;charset=utf-8');
        notify('✅ Đã lưu bài viết.');
      }

      async function loadSavedQuestions() {
        // Giữ bộ đề riêng đã lưu trên trình duyệt này, kể cả bộ đề rỗng.
        let localData = null;
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw !== null) {
            const data = JSON.parse(raw);
            if (Array.isArray(data)) localData = data;
          }
        } catch {
          // Vẫn tải bộ đề công khai khi bộ nhớ trình duyệt không dùng được.
        }

        if (localData !== null) {
          savedQuestions = localData.filter(item => item && typeof item === 'object');
          renderSavedQuestions();
          return;
        }

        // File JSON phải nằm cùng thư mục với trang HTML trên GitHub Pages.
        // Không ghi bản công khai vào localStorage: ảnh lớn có thể vượt hạn mức.
        savedQuestions = [];
        renderSavedQuestions();
        try {
          const url = new URL('./ielts-task-1-questions.json', window.location.href);
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (!Array.isArray(data)) throw new Error('JSON must be an array');

          // Không ghi đè bộ đề người dùng vừa thêm/nhập trong lúc đang tải.
          let hasLocalChanges = savedQuestions.length > 0;
          try {
            hasLocalChanges = hasLocalChanges || localStorage.getItem(STORAGE_KEY) !== null;
          } catch { /* Bộ nhớ trình duyệt có thể bị chặn. */ }
          if (hasLocalChanges) return;

          savedQuestions = data.filter(item => item && typeof item === 'object');
          renderSavedQuestions();
          notify(`✅ Đã tải ${savedQuestions.length} đề từ website. Bấm một đề để mở ảnh.`);
        } catch (error) {
          console.warn('Không tải được bộ đề công khai:', error);
          notify('Chưa tải được bộ đề trên web. Bạn có thể dùng nút Nhập JSON.');
        }
      }

      function persistQuestions() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(savedQuestions));
          renderSavedQuestions();
          return true;
        } catch (error) {
          console.error(error);
          notify('⚠️ Bộ nhớ trình duyệt đã đầy. Hãy xuất JSON rồi xóa bớt đề.');
          return false;
        }
      }

      function renderSavedQuestions() {
        savedList.replaceChildren();

        const searchTerm = searchSaved.value.trim().toLocaleLowerCase('vi');

        const visibleQuestions = savedQuestions
          .map((item, originalIndex) => ({ item, originalIndex }))
          .filter(({ item }) => {
            const matchesType = !currentChartType || item.chartType === currentChartType;
            const searchableText = [item.chartType, item.question, item.essay]
              .filter(Boolean)
              .join(' ')
              .toLocaleLowerCase('vi');
            return matchesType && (!searchTerm || searchableText.includes(searchTerm));
          })
          .sort((a, b) => {
            const aTime = Date.parse(a.item.createdAt || '') || 0;
            const bTime = Date.parse(b.item.createdAt || '') || 0;
            return bTime - aTime || a.originalIndex - b.originalIndex;
          });

        savedCount.textContent = (currentChartType || searchTerm)
          ? `${visibleQuestions.length}/${savedQuestions.length}`
          : savedQuestions.length;

        const typeLabel = currentChartType
          ? `${currentChartType.charAt(0).toUpperCase()}${currentChartType.slice(1)}`
          : 'Tất cả bài';
        collectionSubtitle.textContent = `${typeLabel} · mới nhất trước`;

        if (!visibleQuestions.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = searchTerm
            ? 'Không tìm thấy bài phù hợp.'
            : currentChartType
              ? `Chưa có bài ${currentChartType}. Bấm lại tab để xem tất cả.`
              : 'Chưa có bài nào';
          savedList.appendChild(empty);
          return;
        }

        visibleQuestions.forEach(({ item, originalIndex }) => {
          const row = document.createElement('div');
          row.className = 'saved-item';
          row.title = 'Bấm để mở đề';

          const info = document.createElement('div');
          info.className = 'saved-info';

          const question = document.createElement('div');
          question.className = 'saved-question';
          question.textContent = item.question || 'Chưa có đề bài';

          const meta = document.createElement('div');
          meta.className = 'saved-meta';
          const savedDate = item.createdAt && !Number.isNaN(Date.parse(item.createdAt))
            ? new Intl.DateTimeFormat('vi-VN', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
              }).format(new Date(item.createdAt))
            : 'Chưa rõ ngày lưu';
          meta.textContent = `${item.chartType || 'unknown'} · ${savedDate}`;
          info.append(question, meta);

          const remove = document.createElement('button');
          remove.className = 'delete-item';
          remove.type = 'button';
          remove.textContent = '✖';
          remove.title = 'Xóa đề này';
          remove.addEventListener('click', event => {
            event.stopPropagation();
            const oldItems = [...savedQuestions];
            savedQuestions.splice(originalIndex, 1);
            if (!persistQuestions()) savedQuestions = oldItems;
            else notify('Đã xóa đề.');
          });

          row.addEventListener('click', () => loadQuestion(item));
          row.append(info, remove);
          savedList.appendChild(row);
        });
      }

      function formatSavedDate(value) {
        return value && !Number.isNaN(Date.parse(value))
          ? new Intl.DateTimeFormat('vi-VN', {
              day: '2-digit', month: '2-digit', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            }).format(new Date(value))
          : 'Chưa rõ ngày lưu';
      }

      function renderArchive() {
        archiveList.replaceChildren();
        const searchTerm = archiveSearch.value.trim().toLocaleLowerCase('vi');
        const items = savedQuestions
          .map((item, originalIndex) => ({ item, originalIndex }))
          .filter(({ item }) => {
            if (item.chartType !== archiveChartType) return false;
            const text = [item.question, item.essay].filter(Boolean).join(' ').toLocaleLowerCase('vi');
            return !searchTerm || text.includes(searchTerm);
          })
          .sort((a, b) => {
            const aTime = Date.parse(a.item.createdAt || '') || 0;
            const bTime = Date.parse(b.item.createdAt || '') || 0;
            return bTime - aTime || a.originalIndex - b.originalIndex;
          });

        archiveCount.textContent = `${items.length} bài${searchTerm ? ' phù hợp' : ''} · mới nhất trước`;

        if (!items.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.style.gridColumn = '1 / -1';
          empty.textContent = searchTerm
            ? `Không tìm thấy bài có “${archiveSearch.value.trim()}”.`
            : `Chưa có bài ${archiveChartType}.`;
          archiveList.appendChild(empty);
          return;
        }

        items.forEach(({ item, originalIndex }) => {
          const card = document.createElement('article');
          card.className = 'archive-item';
          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          card.title = 'Bấm để mở bài này';

          const question = document.createElement('div');
          question.className = 'saved-question';
          question.textContent = item.question || 'Chưa có đề bài';

          const meta = document.createElement('div');
          meta.className = 'saved-meta';
          meta.textContent = `${item.chartType || 'unknown'} · ${formatSavedDate(item.createdAt)}`;

          const preview = document.createElement('div');
          preview.className = 'archive-preview';
          const essayPreview = (item.essay || '').trim();
          preview.textContent = essayPreview
            ? `${essayPreview.slice(0, 150)}${essayPreview.length > 150 ? '…' : ''}`
            : 'Chưa có nội dung bài viết.';

          const remove = document.createElement('button');
          remove.className = 'delete-item';
          remove.type = 'button';
          remove.textContent = '✖';
          remove.title = 'Xóa bài này';
          remove.addEventListener('click', event => {
            event.stopPropagation();
            const oldItems = [...savedQuestions];
            savedQuestions.splice(originalIndex, 1);
            if (!persistQuestions()) savedQuestions = oldItems;
            else {
              renderArchive();
              notify('Đã xóa đề.');
            }
          });

          const openItem = () => {
            loadQuestion(item);
            closeArchiveModal();
          };
          card.addEventListener('click', openItem);
          card.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openItem();
            }
          });
          card.append(question, meta, preview, remove);
          archiveList.appendChild(card);
        });
      }

      function openArchive(type) {
        archiveChartType = type;
        const label = `${type.charAt(0).toUpperCase()}${type.slice(1)}`;
        archiveTitle.textContent = `Kho bài ${label}`;
        archiveSearch.value = '';
        renderArchive();
        archiveModal.classList.add('open');
        archiveModal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');
        setTimeout(() => archiveSearch.focus(), 0);
      }

      function closeArchiveModal() {
        archiveModal.classList.remove('open');
        archiveModal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
      }

      function loadQuestion(item) {
        questionInput.value = item.question || '';
        essayInput.value = item.essay || '';
        updateWordCount();
        selectChart(item.chartType || '');
        if (item.image) showImage(item.image);
        else removeCurrentImage(false);
        notify('📂 Đã mở đề.');
      }

      function addCurrentQuestion() {
        const question = questionInput.value.trim();
        const essay = essayInput.value.trim();
        const image = previewImage.getAttribute('src') || '';
        if (!question && !image && !essay) {
          notify('⚠️ Hãy nhập đề, thêm hình hoặc viết bài trước.');
          return;
        }

        const oldItems = [...savedQuestions];
        savedQuestions.unshift({
          question: question || 'Chưa có đề bài',
          chartType: currentChartType || 'unknown',
          image,
          essay,
          createdAt: new Date().toISOString()
        });
        if (!persistQuestions()) savedQuestions = oldItems;
        else notify('✅ Đã thêm vào bộ đề.');
      }

      function exportQuestions() {
        if (!savedQuestions.length) {
          notify('⚠️ Bộ đề đang trống.');
          return;
        }
        download(
          'ielts-task-1-questions.json',
          JSON.stringify(savedQuestions, null, 2),
          'application/json;charset=utf-8'
        );
        notify('✅ Đã xuất bộ đề.');
      }

      function importQuestions(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = event => {
          try {
            const data = JSON.parse(event.target.result);
            if (!Array.isArray(data)) throw new Error('JSON must be an array');
            const validItems = data.filter(item => item && typeof item === 'object');
            const oldItems = [...savedQuestions];
            savedQuestions = validItems;
            if (!persistQuestions()) savedQuestions = oldItems;
            else notify(`✅ Đã nhập ${validItems.length} đề.`);
          } catch (error) {
            console.error(error);
            notify('⚠️ File JSON không hợp lệ.');
          } finally {
            jsonInput.value = '';
          }
        };
        reader.onerror = () => notify('⚠️ Không thể đọc file JSON.');
        reader.readAsText(file, 'utf-8');
      }

      chartButtons.forEach(button => {
        button.addEventListener('click', () => {
          const clickedType = button.dataset.chart;
          selectChart(clickedType);
          openArchive(clickedType);
        });
      });

      essayInput.addEventListener('input', updateWordCount);
      searchSaved.addEventListener('input', renderSavedQuestions);
      archiveSearch.addEventListener('input', renderArchive);
      closeArchive.addEventListener('click', closeArchiveModal);
      archiveModal.addEventListener('click', event => {
        if (event.target === archiveModal) closeArchiveModal();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && archiveModal.classList.contains('open')) closeArchiveModal();
      });

      fontSize.addEventListener('input', () => {
        essayInput.style.fontSize = `${fontSize.value}px`;
        fontSizeValue.textContent = `${fontSize.value}px`;
        localStorage.setItem(FONT_KEY, fontSize.value);
      });

      imageSize.addEventListener('input', () => {
        previewImage.style.width = `${imageSize.value}%`;
        imageSizeValue.textContent = `${imageSize.value}%`;
        localStorage.setItem(IMAGE_SIZE_KEY, imageSize.value);
      });

      fileInput.addEventListener('change', () => {
        readImageFile(fileInput.files?.[0]);
        fileInput.value = '';
      });

      imageStage.addEventListener('click', () => fileInput.click());
      imageStage.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          fileInput.click();
        }
      });

      ['dragenter', 'dragover'].forEach(type => {
        dropZone.addEventListener(type, event => {
          event.preventDefault();
          dropZone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach(type => {
        dropZone.addEventListener(type, event => {
          event.preventDefault();
          dropZone.classList.remove('dragover');
        });
      });

      dropZone.addEventListener('drop', event => {
        const file = [...(event.dataTransfer?.files || [])].find(item => item.type.startsWith('image/'));
        if (file) {
          readImageFile(file);
          return;
        }

        const html = event.dataTransfer?.getData('text/html') || '';
        const text = event.dataTransfer?.getData('text/plain') || '';
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const src = doc.querySelector('img')?.src || (/^(https?:|data:image)/i.test(text) ? text : '');
        if (src) showImage(src);
        else notify('⚠️ Không nhận diện được hình ảnh.');
      });

      document.addEventListener('paste', handlePaste);
      $('removeImage').addEventListener('click', event => {
        event.stopPropagation();
        removeCurrentImage();
      });

      $('saveEssay').addEventListener('click', saveEssayFile);
      $('clearEssay').addEventListener('click', () => {
        essayInput.value = '';
        updateWordCount();
        notify('Đã xóa bài viết.');
      });

      $('fillSample').addEventListener('click', () => {
        questionInput.value = 'The chart below shows the percentage of households in owned and rented accommodation in England and Wales between 1918 and 2011.';
        essayInput.value = `The bar chart compares the proportions of households living in owned and rented accommodation in England and Wales from 1918 to 2011.\n\nOverall, home ownership became increasingly common during most of the period, while renting followed the opposite trend. However, both patterns changed slightly in the final decade.\n\nIn 1918, approximately 78% of households rented their homes, compared with only 22% that owned them. The gap then narrowed steadily, and the two figures were equal at 50% in 1971.\n\nAfter 1971, ownership continued to rise and reached a peak of about 69% in 2001. By contrast, renting fell to roughly 31%. In the final year, the ownership rate declined to around 64%, whereas the proportion of renters recovered to 36%.`;
        selectChart('bar');
        updateWordCount();
        notify('📄 Đã điền bài mẫu.');
      });

      $('addQuestion').addEventListener('click', addCurrentQuestion);
      $('exportJson').addEventListener('click', exportQuestions);
      jsonInput.addEventListener('change', () => importQuestions(jsonInput.files?.[0]));

      function readPreference(key) {
        try { return localStorage.getItem(key); } catch { return null; }
      }

      const savedFont = Number(readPreference(FONT_KEY));
      if (savedFont >= 12 && savedFont <= 28) fontSize.value = savedFont;
      essayInput.style.fontSize = `${fontSize.value}px`;
      fontSizeValue.textContent = `${fontSize.value}px`;

      const savedImageSize = Number(readPreference(IMAGE_SIZE_KEY));
      if (savedImageSize >= 30 && savedImageSize <= 100) imageSize.value = savedImageSize;
      previewImage.style.width = `${imageSize.value}%`;
      imageSizeValue.textContent = `${imageSize.value}%`;

      updateWordCount();
      loadSavedQuestions();
    })();
  </script>
</body>
</html>
